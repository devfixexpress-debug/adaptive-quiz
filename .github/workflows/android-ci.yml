name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Lint y APK debug
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Aceptar licencias del Android SDK
        run: yes | sdkmanager --licenses

      - name: Instalar Android SDK Platform 37
        run: sdkmanager --install --channel=3 "platforms;android-37.0"

      - name: Habilitar Gradle Wrapper
        run: chmod +x mobile/gradlew

      - name: Ejecutar lint y ensamblar APK debug
        working-directory: mobile
        run: ./gradlew lintDebug assembleDebug --no-daemon
