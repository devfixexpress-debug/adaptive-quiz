server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: adaptive-quiz-api
  config:
    import: optional:file:${ADAPTIVEQUIZ_ENV_FILE:./.env}[.properties]
  profiles:
    active: ${APP_ENV:local}
  datasource:
    url: jdbc:postgresql://${ADAPTIVEQUIZ_DB_HOST:localhost}:${ADAPTIVEQUIZ_DB_PORT:5432}/${ADAPTIVEQUIZ_DB_NAME:adaptivequiz}
    username: ${ADAPTIVEQUIZ_DB_USERNAME}
    password: ${ADAPTIVEQUIZ_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        physical_naming_strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
        jdbc:
          time_zone: UTC
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: false

springdoc:
  api-docs:
    enabled: ${OPENAPI_ENABLED:true}
    path: /api-docs
  swagger-ui:
    enabled: ${SWAGGER_UI_ENABLED:true}
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: ${ACTUATOR_HEALTH_DETAILS:when_authorized}

logging:
  level:
    com.veltia.adaptivequiz: ${ADAPTIVEQUIZ_LOG_LEVEL:INFO}
    org.flywaydb: ${FLYWAY_LOG_LEVEL:INFO}
