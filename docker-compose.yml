services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${ADAPTIVEQUIZ_DB_NAME:-adaptivequiz}
      POSTGRES_USER: ${ADAPTIVEQUIZ_DB_USERNAME:-adaptivequiz}
      POSTGRES_PASSWORD: ${ADAPTIVEQUIZ_DB_PASSWORD:-adaptivequiz}
    ports:
      - "${ADAPTIVEQUIZ_DB_EXPOSED_PORT:-5432}:5432"
    volumes:
      - adaptive_quiz_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  adaptive_quiz_postgres_data:
